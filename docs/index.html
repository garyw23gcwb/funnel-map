<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logomark.svg" type="image/svg+xml">
<title>Funnel Ecosystem Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}</style>
<style>
  /* Brand Guidelines, GCWB & Bookfunnels.io. Dark Navy is the page, Pearl
     Blue the type, and the background is Dark Mode Gradient 1: a teal glow
     low left and a blue one high right. */
  :root {
    color-scheme: dark;
    --navy: #1a212c;
    --pearl: #f4f6f9;
    --teal: #2899ad;
    --cyan: #37bbd4;
    --aqua: #d3f5fa;
    --deep-teal: #176b7b;
    --deep-blue: #23486b;

    --paper: var(--navy);
    --ink: var(--pearl);
    --panel: rgba(244, 246, 249, 0.028);
    --boxbg: #202836;
    --line: rgba(244, 246, 249, 0.16);
    --faint: #8a97ab;
    --slate: #3c4859;
    --wash: rgba(55, 187, 212, 0.14);
    --pen: var(--cyan);
    --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  }

  html { background: var(--paper); }
  body { margin: 0; color: var(--ink); font-family: var(--sans); background: var(--navy); }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 32px 16px 56px; }
  .head { width: min(1400px, 100%); margin: 0 auto 20px; }

  /* Primary logo, dark-background version, straight from the brand archive. */
  .logo {
    display: block; width: 178px; height: 28px; margin-bottom: 22px;
    background: url(logo.svg) no-repeat left center / contain;
  }

  /* The guidelines' page header: a hairline rule with a four-part meta row
     under it, then the title set in the display serif. */
  .metarow {
    display: flex; flex-wrap: wrap; gap: 6px 40px;
    padding: 13px 0 14px; margin-bottom: 40px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-size: 13.5px; color: var(--ink);
  }
  .metarow { letter-spacing: 0.14em; text-transform: uppercase; font-size: 11.5px; color: var(--faint); }

  h1 {
    font-family: var(--serif); font-weight: 300; font-size: 58px;
    line-height: 1.04; letter-spacing: -0.005em; margin: 0; color: var(--ink);
  }
  .booktitle {
    font-family: var(--serif); font-weight: 300; font-size: 34px;
    line-height: 1.12; margin: 6px 0 0; color: var(--cyan);
  }
  .sub {
    font-size: 15.5px; color: var(--faint); margin: 18px 0 0;
    line-height: 1.6; max-width: 880px;
    /* Wide enough for the sentence to sit on one line on a desktop header;
       balance keeps the break even rather than orphaning "to open it."
       when the viewport is narrower. */
    text-wrap: balance;
  }
  .sub b { color: var(--ink); font-weight: 400; font-style: normal; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 26px 0 0;
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--faint);
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .dot {
    width: 10px; height: 10px; flex: none;
    border: 2px solid var(--slate); border-radius: 2px 4px 3px 5px;
  }
  .dot.live { border-color: var(--cyan); background: rgba(55, 187, 212, 0.22); }
  .dot.review { border-color: var(--teal); }
  .dot.soon { border-style: dashed; }
  .legend span { display: none; }
  .legend span.on { display: inline-flex; }

  .notice {
    display: none; margin: 22px 0 0; padding: 10px 14px;
    font-size: 13.5px; color: var(--aqua);
    border: 1px solid rgba(211, 245, 250, 0.3); border-radius: 2px;
    background: rgba(211, 245, 250, 0.06);
  }
  .notice.on { display: block; }

  .shell { overflow-x: auto; padding-bottom: 6px; }
  .stage { position: relative; margin: 0 auto; }
  .board {
    position: relative; width: 1400px; height: 1400px; margin: 0 auto;
    transform-origin: top left;
    border: 1px solid var(--line);
    border-radius: 3px;
    /* Dark Mode Gradient 1 lives here, on the board, so the page around it
       stays the flat brand navy. */
    background:
      radial-gradient(880px 620px at 7% 80%, rgba(23, 107, 123, 0.42), transparent 62%),
      radial-gradient(820px 580px at 93% 12%, rgba(35, 72, 107, 0.46), transparent 64%),
      var(--navy);
  }
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; color: rgba(244,246,249,0.55); pointer-events: none; }
  #wires path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #wires path.dashed { stroke-dasharray: 7 7; opacity: 0.65; }

  .group {
    position: absolute; background: rgba(244, 246, 249, 0.022);
    border: 1px solid var(--line); border-radius: 3px;
  }
  .titlebox {
    position: absolute; display: inline-block; padding: 6px 16px 7px;
    background: var(--navy); border: 1px solid var(--line); border-radius: 2px;
    font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--faint); white-space: nowrap;
  }
  .sublabel {
    position: absolute; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--faint); white-space: nowrap;
  }
  .wirelabel {
    position: absolute; font-family: var(--sans); font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint);
    white-space: nowrap; background: var(--navy); padding: 2px 7px 3px; border-radius: 2px;
  }
  /* Reads bottom-to-top alongside a vertical wire, where a horizontal
     label would collide with a layer title. */
  .wirelabel.vert { transform: rotate(-90deg); transform-origin: left top; }

  .card {
    position: absolute; display: flex; flex-direction: column; gap: 5px;
    padding: 13px 15px 12px; text-decoration: none; color: inherit;
    background: var(--boxbg); border: 2.5px solid var(--slate);
    border-radius: 4px 9px 5px 8px;
    font-family: var(--sans); overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease;
  }
  button.card { font: inherit; text-align: left; cursor: pointer; }
  button.card:hover, button.card:focus-visible {
    background: var(--wash); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }
  button.card:focus-visible { outline: 2px solid var(--pen); outline-offset: 3px; }
  button.card .cmeta { color: var(--pen); }
  .card.tilt { transform: rotate(0.6deg); }
  .card.tilt2 { transform: rotate(-0.5deg); }
  .card.live { border-color: var(--cyan); }
  .card.review { border-color: var(--teal); }
  .card.soon { border-style: dashed; opacity: 0.55; }

  .clabel { font-size: 16.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .scard { position: relative; }
  .cjob { font-size: 12.5px; line-height: 1.42; color: var(--faint); flex: 1; }
  .cmeta { font-size: 11.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
  a.card .cmeta { color: var(--pen); }

  a.card:hover, a.card:focus-visible {
    background: var(--wash); transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }
  a.card.tilt:hover, a.card.tilt:focus-visible { transform: rotate(0.6deg) translateY(-2px); }
  a.card.tilt2:hover, a.card.tilt2:focus-visible { transform: rotate(-0.5deg) translateY(-2px); }
  a.card:focus-visible { outline: 2px solid var(--pen); outline-offset: 3px; }

  .chips {
    position: absolute; display: flex; flex-wrap: wrap; gap: 6px;
    align-content: flex-start; font-family: var(--sans);
  }
  .chip {
    display: grid; place-items: center; width: 40px; height: 28px;
    font-size: 12.5px; font-weight: 500; color: var(--faint);
    text-decoration: none; background: var(--boxbg);
    border: 2px solid var(--slate); border-radius: 3px 6px 4px 7px;
  }
  a.chip, button.chip { color: var(--cyan); border-color: var(--cyan); }
  button.chip { font-family: var(--sans); cursor: pointer; padding: 0; }
  a.chip:hover, a.chip:focus-visible,
  button.chip:hover, button.chip:focus-visible { background: var(--wash); color: var(--ink); }
  a.chip:focus-visible, button.chip:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

  /* Files a container delivers, each with its own status, so it is obvious
     what the client has supplied and what is still missing. */
  .slots {
    position: absolute; display: flex; gap: 6px;
    align-items: stretch; font-family: var(--sans);
  }
  .slot {
    flex: 1 1 0; min-width: 0; display: grid; place-items: center;
    font-size: 10.5px; font-weight: 500; letter-spacing: 0.04em;
    text-decoration: none; color: var(--faint); background: var(--navy);
    border: 1.5px solid var(--slate); border-radius: 3px 5px 3px 5px;
    overflow: hidden; white-space: nowrap;
  }
  a.slot { color: var(--cyan); border-color: var(--cyan); }
  a.slot:hover, a.slot:focus-visible { background: var(--wash); color: var(--ink); }
  a.slot:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
  .slot.soon { border-style: dashed; opacity: 0.65; }

  /* Pop-up for a single ad or email, so a click does not lose the map. */
  .veil {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(14, 19, 26, 0.86); padding: 28px 18px;
    overflow-y: auto; font-family: var(--sans);
  }
  .veil.on { display: block; }
  .modal {
    position: relative; max-width: 720px; margin: 0 auto;
    background: #1c2430; border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
  }
  .mclose {
    position: absolute; top: -14px; right: -14px; width: 34px; height: 34px;
    display: grid; place-items: center; cursor: pointer;
    font-size: 19px; line-height: 1; color: var(--ink);
    background: var(--navy); border: 1px solid var(--line); border-radius: 50%;
  }
  .mclose:hover { background: var(--wash); }
  .mclose:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
  .mhead { padding: 16px 20px 13px; border-bottom: 1.5px solid #333e52; }
  .mkicker { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .mtitle { font-family: var(--serif); font-size: 27px; font-weight: 400; margin: 6px 0 3px; line-height: 1.15; }
  .msub { font-size: 13.5px; color: var(--faint); }
  .msub.it { font-style: italic; }
  .mprice { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; font-size: 15px; }
  .mprice b { font-size: 21px; font-weight: 600; color: var(--cyan); }
  .mprice s { color: var(--faint); }
  .mprice span { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .mcheck {
    display: flex; gap: 11px; align-items: flex-start;
    margin: 16px 20px 0; padding: 13px 15px;
    border: 1.5px dashed var(--cyan); border-radius: 3px 7px 4px 6px;
    background: rgba(55, 187, 212, 0.07); font-size: 14.5px; line-height: 1.45;
  }
  .mtick {
    flex: none; display: grid; place-items: center; width: 20px; height: 20px;
    color: var(--navy); background: var(--cyan);
    border-radius: 3px 5px 3px 5px; font-size: 13px; font-weight: 700;
  }
  .mbody { padding: 16px 20px; }
  .mbody p { margin: 0 0 12px; font-size: 15px; line-height: 1.6; }
  .mbody p:last-child { margin-bottom: 0; }
  .mlink { color: var(--cyan); text-decoration: none; border-bottom: 1px solid rgba(55,187,212,0.45); }
  .mlink:hover { border-bottom-color: var(--cyan); }
  .mtodo {
    display: inline-block; padding: 3px 10px 4px; font-size: 13px;
    color: var(--aqua); border: 1px dashed rgba(211, 245, 250, 0.4); border-radius: 2px;
    background: rgba(211, 245, 250, 0.06);
  }
  .mshots {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
    align-items: start; background: #333e52;
  }
  .mshot { position: relative; display: flex; justify-content: center; padding: 12px 10px; background: var(--boxbg); }
  .mshot img { display: block; width: auto; max-width: 100%; max-height: 360px; }
  .mshot figcaption {
    position: absolute; left: 8px; top: 8px; padding: 2px 8px 3px;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink); background: rgba(26, 33, 44, 0.82); border-radius: 4px;
  }
  @media (max-width: 620px) { .mshots { grid-template-columns: 1fr; } }
  .mfoot {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 13px 20px 14px; border-top: 1.5px solid #333e52; background: var(--boxbg);
  }
  .mfoot .txt { flex: 1; min-width: 190px; }
  .mhl { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .mdesc { font-size: 13px; color: var(--faint); margin-top: 2px; }
  .mcta {
    padding: 8px 14px 9px; font-size: 13px; font-weight: 500; white-space: nowrap;
    color: var(--ink); background: var(--panel);
    border: 1.5px solid var(--faint); border-radius: 6px;
  }
  .mnav { display: flex; justify-content: space-between; gap: 10px; padding: 12px 20px 16px; }
  .mnav button {
    font-family: var(--sans); font-size: 13.5px; cursor: pointer; color: var(--pen);
    background: transparent; border: 1.5px solid #38445a; border-radius: 8px; padding: 7px 13px 8px;
  }
  .mnav button:hover:not(:disabled) { background: var(--wash); }
  .mnav button:disabled { opacity: 0.35; cursor: default; }

  /* Narrow view. Below roughly 900px the board has to scale under 0.62,
     which puts the job lines under 8px. The same nodes are listed layer by
     layer instead, which stays readable all the way down to a phone. */
  .stack { display: none; width: 100%; margin: 4px auto 0; font-family: var(--sans); }
  .slayer { margin: 0 0 26px; }
  .stitle {
    font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 12px;
    padding-bottom: 9px; border-bottom: 1px solid var(--line);
  }
  .scard {
    display: flex; flex-direction: column; gap: 4px;
    text-decoration: none; color: inherit;
    padding: 12px 14px; margin: 0 0 8px;
    background: var(--boxbg); border: 2px solid var(--slate);
    border-radius: 4px 9px 5px 8px;
  }
  .scard.live { border-color: var(--cyan); }
  .scard.review { border-color: var(--teal); }
  .scard.soon { border-style: dashed; opacity: 0.55; }
  .scard .clabel { font-size: 15.5px; }
  .scard .cjob { font-size: 13px; flex: none; }
  .scard .cmeta { font-size: 11px; margin-top: 2px; }
  a.scard .cmeta { color: var(--pen); }
  a.scard:active { background: var(--wash); }

  @media (max-width: 900px) {
    .shell { display: none; }
    .stack { display: block; }
  }
  @media (max-width: 620px) {
    .wrap { padding: 22px 14px 40px; }
    h1 { font-size: 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    a.card:hover, a.card:focus-visible { transform: none; }
  }

  @page { size: landscape; margin: 10mm; }
  @media print {
    .wrap { padding: 0; max-width: none; }
    .shell { overflow: visible; }
    .stack, .notice { display: none !important; }
    .head { margin-bottom: 10px; }
    .logo { margin-bottom: 12px; }
    h1 { font-size: 24px; }
    .sub, .legend { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="logo" role="img" aria-label="bookfunnels.io"></span>
    <div class="metarow">
      <span>Funnel Map</span>
    </div>
    <h1 id="hClient">Funnel Ecosystem Map</h1>
    <p class="booktitle" id="hBook"></p>
    <p class="sub" id="hSub"></p>
    <div class="legend" id="legend">
      <span data-state="live"><i class="dot live"></i> Live, click to open</span>
      <span data-state="review"><i class="dot review"></i> Built, in review</span>
      <span data-state="soon"><i class="dot soon"></i> Still to come</span>
      <span data-state="theirs"><i class="dot"></i> Run by you</span>
    </div>
    <p class="notice" id="notice"></p>
  </div>

  <div class="shell">
    <div class="stage" id="stage">
      <div class="board" id="board">
        <svg id="wires" viewBox="0 0 1400 1400" aria-hidden="true">
          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M1.5,1.2 L8.5,5 L1.5,8.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>
          </defs>
          <g id="wiregroup"></g>
        </svg>
      </div>
    </div>
  </div>

  <div class="stack" id="stack"></div>
</div>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="mtitle" hidden>
  <div class="modal" id="modal">
    <button class="mclose" id="mclose" aria-label="Close">&times;</button>
    <div id="mcontent"></div>
  </div>
</div>

<!-- Bump ?v= whenever catalogue.js changes. GitHub Pages serves assets with a
     ten minute max-age, so without this a viewer can hold a stale catalogue
     and see the wrong boxes after an update. -->
<script src="catalogue.js?v=14"></script>
<script>
(function () {
  'use strict';

  var C = window.FUNNEL_CATALOGUE;
  /* Matches the 999px breakpoint below which the board is swapped for the
     stacked list, so the board never renders smaller than this. */
  /* BOARD_H is worked out per client in render(), from the nodes shown. */
  var BOARD_W = C.BOARD_W, BOARD_H = 1200, MIN_SCALE = 0.62;
  var LAYERS = C.LAYERS, NODES = C.NODES, GROUPS = C.GROUPS;
  var SUBLABELS = C.SUBLABELS, CHIPS = C.CHIPS, AD_CHIPS = C.AD_CHIPS, EDGES = C.EDGES;

  /* --------------------------- helpers --------------------------- */

  var NODE = {};
  NODES.forEach(function (n) { NODE[n.id] = n; });

  function $(id) { return document.getElementById(id); }
  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function r1(v) { return Math.round(v * 10) / 10; }

  function anchor(spec) {
    var at = spec.split('@');
    var bits = at[0].split(':');
    var n = NODE[bits[0]], side = bits[1];
    var f = at.length > 1 ? parseFloat(at[1]) : 0.5;
    if (side === 't') return [n.x + n.w * f, n.y];
    if (side === 'b') return [n.x + n.w * f, n.y + n.h];
    if (side === 'l') return [n.x, n.y + n.h * f];
    return [n.x + n.w, n.y + n.h * f];
  }
  function edgeNodeIds(e) {
    return [e.a.split('@')[0].split(':')[0], e.b.split('@')[0].split(':')[0]];
  }

  function len(a, b) { return Math.hypot(b[0] - a[0], b[1] - a[1]); }
  function unit(a, b) {
    var d = len(a, b) || 1;
    return [(b[0] - a[0]) / d, (b[1] - a[1]) / d];
  }

  /* Polyline with rounded corners. The last point is pulled back a few
     pixels so the arrowhead sits just off the card edge rather than on it. */
  function routePath(pts, gap) {
    pts = pts.slice();
    var n = pts.length;
    if (gap) {
      var u = unit(pts[n - 2], pts[n - 1]);
      pts[n - 1] = [pts[n - 1][0] - u[0] * gap, pts[n - 1][1] - u[1] * gap];
    }
    var d = 'M' + r1(pts[0][0]) + ',' + r1(pts[0][1]);
    for (var i = 1; i < pts.length - 1; i++) {
      var p = pts[i], a = pts[i - 1], b = pts[i + 1];
      var u1 = unit(a, p), u2 = unit(p, b);
      var rr = Math.min(18, len(a, p) / 2, len(p, b) / 2);
      d += ' L' + r1(p[0] - u1[0] * rr) + ',' + r1(p[1] - u1[1] * rr);
      d += ' Q' + r1(p[0]) + ',' + r1(p[1]) + ' ' + r1(p[0] + u2[0] * rr) + ',' + r1(p[1] + u2[1] * rr);
    }
    var last = pts[pts.length - 1];
    return d + ' L' + r1(last[0]) + ',' + r1(last[1]);
  }

  /* --------------------------- config --------------------------- */

  function decodeInline(s) {
    try {
      var bin = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (err) { return null; }
  }

  var EMPTY = { client: '', book: '', nodes: {}, emails: [] };

  function normalise(cfg) {
    cfg = cfg || {};
    cfg.nodes = cfg.nodes || {};
    cfg.emails = cfg.emails || [];
    return cfg;
  }

  function stateOf(cfg, id) {
    var c = cfg.nodes[id];
    /* Nodes marked optional stay hidden unless a client file mentions them,
       so adding one does not put a phantom "still to come" box on every
       existing client's map. Everything else defaults to still-to-come. */
    if (!c) return NODE[id].optional ? null : { status: 'soon', url: '' };
    if (c.off) return null;
    var url = (c.url || '').trim();
    /* A declared status is honoured even with no link, for pieces that are
       real but have nothing to open: "theirs" for what the client runs
       themselves, and "live" for a box whose links live inside it, like the
       ads card holding its ten concepts. Anything undeclared is still to come. */
    if (!url) {
      var declared = c.status === 'theirs' || c.status === 'live' || c.status === 'review';
      return { status: declared ? c.status : 'soon', url: '', label: c.label, job: c.job, cta: c.cta, popup: c.popup };
    }
    return { status: c.status === 'review' ? 'review' : 'live', url: url, label: c.label, job: c.job, cta: c.cta, popup: c.popup };
  }

  /* --------------------------- render --------------------------- */

  function render(cfg, noticeText) {
    cfg = normalise(cfg);

    var title = cfg.client ? cfg.client : 'Funnel Ecosystem Map';
    document.title = cfg.client ? cfg.client + ' | Funnel Ecosystem Map' : 'Funnel Ecosystem Map';
    $('hClient').textContent = title;

    $('hBook').textContent = cfg.book || '';
    $('hSub').textContent =
      'Everything built for this funnel, and how each piece feeds the next. Click any live box to open it.';

    if (noticeText) {
      $('notice').textContent = noticeText;
      $('notice').classList.add('on');
    }

    var board = $('board');
    var shown = {};

    NODES.forEach(function (n) {
      var st = stateOf(cfg, n.id);
      if (st) shown[n.id] = st;
    });

    /* Size the board to what this client actually has, so switching whole
       sections off shortens the page instead of leaving empty space. */
    var lowest = 0;
    NODES.forEach(function (n) { if (shown[n.id]) lowest = Math.max(lowest, n.y + n.h); });
    if (shown['email-sequence']) lowest = Math.max(lowest, CHIPS.y + CHIPS.h);
    GROUPS.forEach(function (g) {
      var members = NODES.filter(function (n) { return n.layer === g.id && shown[n.id]; });
      if (members.length > 1) lowest = Math.max(lowest, g.y + g.h);
    });
    BOARD_H = lowest + 44;


    var states = {};
    Object.keys(shown).forEach(function (id) { states[shown[id].status] = true; });
    [].forEach.call($('legend').children, function (sp) {
      sp.classList.toggle('on', !!states[sp.getAttribute('data-state')]);
    });

    /* group boxes, drawn first so wires and cards sit on top */
    /* A group holding a single card needs no wrapper, no band title and no
       sub-heading: the card's own label says what it is, and the chrome
       would only repeat it. */
    var solo = {};
    GROUPS.forEach(function (g) {
      var members = NODES.filter(function (n) { return n.layer === g.id && shown[n.id]; });
      if (members.length < 2) { solo[g.id] = members.length === 1; return; }
      /* Shrink to fit what is actually shown, so a client running one side
         funnel does not get a full-height box with two cards in it. */
      var bottom = Math.max.apply(null, members.map(function (n) { return n.y + n.h; }));
      var d = el('div', 'group');
      d.style.cssText = pos(g.x, g.y, g.w, Math.min(g.h, bottom + 26 - g.y));
      board.appendChild(d);
    });

    /* wires */
    var wg = $('wiregroup'), NS = 'http://www.w3.org/2000/svg';
    EDGES.forEach(function (e) {
      var ids = edgeNodeIds(e);
      if (!shown[ids[0]] || !shown[ids[1]]) return;
      var pts = [anchor(e.a)].concat(e.via || []).concat([anchor(e.b)]);
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', routePath(pts, e.arrow === false ? 0 : 5));
      if (e.dashed) p.setAttribute('class', 'dashed');
      if (e.arrow !== false) p.setAttribute('marker-end', 'url(#ah)');
      wg.appendChild(p);
      if (e.label) {
        var l = el('div', 'wirelabel' + (e.vert ? ' vert' : ''));
        l.style.left = e.lx + 'px';
        l.style.top = e.ly + 'px';
        l.textContent = e.label;
        board.appendChild(l);
      }
    });

    /* layer titles */
    /* Only layers with a title position (the side-funnel block) get one. */
    LAYERS.forEach(function (L) {
      if (L.lx == null || solo[L.id]) return;
      var any = NODES.some(function (n) { return n.layer === L.id && shown[n.id]; });
      if (!any) return;
      var t = el('div', 'titlebox');
      t.style.left = L.lx + 'px';
      t.style.top = L.ly + 'px';
      t.textContent = L.title;
      board.appendChild(t);
    });

    SUBLABELS.forEach(function (s) {
      if (!s.needs.some(function (id) { return shown[id]; })) return;
      if (s.needs.some(function (id) { return NODE[id] && solo[NODE[id].layer]; })) return;
      var d = el('div', 'sublabel');
      d.style.left = s.x + 'px';
      d.style.top = s.y + 'px';
      d.textContent = s.text;
      board.appendChild(d);
    });

    /* cards */
    NODES.forEach(function (n) {
      var st = shown[n.id];
      if (!st) return;
      var card = buildCard(n, st, 'card');
      card.style.cssText += pos(n.x, n.y, n.w, n.h);
      if (n.tilt === 1) card.className += ' tilt';
      if (n.tilt === 2) card.className += ' tilt2';
      board.appendChild(card);
    });

    /* email chips */
    if (shown['email-sequence']) {
      var box = el('div', 'chips');
      box.style.cssText = pos(CHIPS.x, CHIPS.y, CHIPS.w, CHIPS.h);
      var byN = {};
      cfg.emails.forEach(function (e) { if (e && e.n) byN[e.n] = e; });
      for (var i = 1; i <= CHIPS.count; i++) {
        var e = byN[i] || {};
        var url = (e.url || '').trim();
        var title = 'Email ' + i + (e.day != null ? ', day ' + e.day : '');
        var c;
        if (url) {
          c = el('a', 'chip');
          c.href = url; c.target = '_blank'; c.rel = 'noopener';
          c.textContent = i;
          c.title = title;
        } else if (cfg.emailPages) {
          /* No explicit link, but the copy is loaded: open the pop-up. */
          c = popChip('email', i, title);
        } else {
          c = el('span', 'chip');
          c.textContent = i;
          c.title = title;
        }
        box.appendChild(c);
      }
      board.appendChild(box);
    }

    /* file slots inside their container */
    NODES.forEach(function (n) {
      if (!n.slots || !shown[n.id]) return;
      var box = el('div', 'slots');
      box.style.cssText = pos(n.slots.x, n.slots.y, n.slots.w, n.slots.h);
      n.slots.items.forEach(function (it) {
        var c = cfg.nodes[it.id] || {};
        if (c.off) return;
        var url = (c.url || '').trim();
        var sl = el(url ? 'a' : 'span', 'slot' + (url ? '' : ' soon'));
        if (url) { sl.href = url; sl.target = '_blank'; sl.rel = 'noopener'; }
        sl.textContent = c.label || it.label;
        sl.title = (it.title || it.label) + (url ? '' : ' — still to come');
        box.appendChild(sl);
      });
      board.appendChild(box);
    });

    /* ten ad concepts, each opening the pop-up */
    if (shown['ads'] && cfg.adPages) {
      var ab = el('div', 'chips');
      ab.style.cssText = pos(AD_CHIPS.x, AD_CHIPS.y, AD_CHIPS.w, AD_CHIPS.h);
      for (var a = 1; a <= AD_CHIPS.count; a++) {
        ab.appendChild(popChip('ad', a, 'Ad concept ' + a));
      }
      board.appendChild(ab);
    }

    /* The catalogue is authoritative for board size. */
    $('board').style.width = BOARD_W + 'px';
    $('board').style.height = BOARD_H + 'px';
    $('wires').setAttribute('viewBox', '0 0 ' + BOARD_W + ' ' + BOARD_H);

    /* Warm the pop-up data now, so the first chip click is instant instead
       of waiting on a cold fetch. Failures are retried on click. */
    if (cfg.adPages && shown['ads']) { load('ad').catch(function () {}); }
    if (cfg.emailPages && shown['email-sequence']) { load('email').catch(function () {}); }

    buildStack(cfg, shown);
    fitBoard();
  }

  /* A chip that opens the pop-up rather than navigating. A button, so it is
     keyboard reachable and is not announced as a link to nowhere. */
  function popChip(kind, n, title) {
    var b = el('button', 'chip');
    b.type = 'button';
    b.textContent = n;
    b.title = title;
    b.setAttribute('aria-label', title);
    b.addEventListener('click', function () { openPop(kind, n); });
    return b;
  }

  function pos(x, y, w, h) {
    return 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;';
  }

  function buildCard(n, st, cls) {
    var isLink = !!st.url;
    /* A node with its own pop-up content and no page of its own becomes a
       button, so it is keyboard reachable and not a link to nowhere. */
    var isPop = !isLink && !!st.popup;
    var card = el(isLink ? 'a' : (isPop ? 'button' : 'div'), cls + ' ' + st.status);
    if (isLink) { card.href = st.url; card.target = '_blank'; card.rel = 'noopener'; }
    if (isPop) {
      card.type = 'button';
      card.addEventListener('click', function () { openInline(st.popup); });
    }


    var lab = el('span', 'clabel');
    lab.textContent = st.label || n.label;
    card.appendChild(lab);

    var job = el('span', 'cjob');
    job.textContent = st.job || n.job;
    card.appendChild(job);

    /* The board's slim cards (the order bump) have no room for a third
       line; the stacked phone view always does. They are still clickable,
       and being anchors they still show a pointer cursor. */
    var wantsMeta = isLink || isPop || st.status === 'soon';
    if ((cls === 'scard' || n.h > 100) && wantsMeta) {
      var meta = el('span', 'cmeta');
      meta.textContent = (isLink || isPop)
        ? (st.cta || n.cta || (isPop ? 'See the copy' : 'Open page')) + (st.status === 'review' ? ' · in review' : '')
        : 'Still to come';
      card.appendChild(meta);
    }
    return card;
  }

  function buildStack(cfg, shown) {
    var stack = $('stack');
    LAYERS.forEach(function (L) {
      var members = NODES.filter(function (n) { return n.layer === L.id && shown[n.id]; });
      if (!members.length) return;
      var sec = el('section', 'slayer');
      var h = el('h2', 'stitle');
      h.textContent = L.title;
      sec.appendChild(h);
      members.forEach(function (n) {
        var c = buildCard(n, shown[n.id], 'scard');
        sec.appendChild(c);
      });
      stack.appendChild(sec);
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* --------------------------- pop-up --------------------------- */

  var cache = {}, lastFocus = null, popKind = null, popN = 0, popMax = 0;

  /* These files are static, so let the browser cache them normally: forcing
     revalidation on every open cost seconds on a cold CDN. A rejection is
     never cached, otherwise one blip would disable every chip on the page
     until reload. */
  function load(kind) {
    var file = 'clients/' + slug + '-' + (kind === 'ad' ? 'ads' : 'emails') + '.json';
    if (!cache[kind]) {
      cache[kind] = fetch(file).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      }).catch(function (err) {
        delete cache[kind];
        throw err;
      });
    }
    return cache[kind];
  }

  function showVeil() {
    var veil = $('veil');
    if (veil.classList.contains('on')) return;
    lastFocus = document.activeElement;
    veil.hidden = false;
    veil.classList.add('on');
    document.body.style.overflow = 'hidden';
    $('mclose').focus();
  }

  function popMessage(text) {
    var c = $('mcontent');
    c.textContent = '';
    var head = el('div', 'mhead');
    var t = el('div', 'mtitle');
    t.id = 'mtitle';
    t.textContent = text;
    head.appendChild(t);
    c.appendChild(head);
  }

  /* Open straight away and fill in when the data lands. Waiting silently for
     a slow fetch made every chip look broken. */
  function openPop(kind, n) {
    showVeil();
    var pending = true;
    setTimeout(function () { if (pending) popMessage('Loading…'); }, 150);

    load(kind).then(function (data) {
      pending = false;
      var list = kind === 'ad' ? (data.ads || []) : (data.emails || []);
      var item = list.filter(function (x) { return x.n === n; })[0];
      if (!item) { popMessage('That one is not in the file yet.'); return; }
      popKind = kind; popN = n; popMax = list.length;
      var c = $('mcontent');
      c.textContent = '';
      (kind === 'ad' ? adPop : mailPop)(c, item, data);
      c.appendChild(popNav());
    }).catch(function () {
      pending = false;
      popMessage(kind === 'ad' ? 'The ads could not be loaded. Try again in a moment.'
                               : 'The emails could not be loaded. Try again in a moment.');
    });
  }

  /* Content that belongs to a node rather than to a numbered set, such as
     the bump upgrade that lives inside the order form. No prev/next. */
  function openInline(pop) {
    if (!pop) return;
    showVeil();
    var c = $('mcontent');
    c.textContent = '';

    var head = el('div', 'mhead');
    if (pop.kicker) { var k = el('div', 'mkicker'); k.textContent = pop.kicker; head.appendChild(k); }
    var t = el('div', 'mtitle'); t.id = 'mtitle'; t.textContent = pop.title || ''; head.appendChild(t);
    if (pop.price || pop.was) {
      var pr = el('div', 'mprice');
      var now = el('b'); now.textContent = pop.price || ''; pr.appendChild(now);
      if (pop.was) { var w = el('s'); w.textContent = pop.was; pr.appendChild(w); }
      if (pop.note) { var nn = el('span'); nn.textContent = pop.note; pr.appendChild(nn); }
      head.appendChild(pr);
    }
    c.appendChild(head);

    if (pop.check) {
      var row = el('div', 'mcheck');
      var box = el('span', 'mtick');
      box.textContent = '\u2713';
      row.appendChild(box);
      var lab = el('span');
      lab.textContent = pop.check;
      row.appendChild(lab);
      c.appendChild(row);
    }

    var body = el('div', 'mbody');
    popParas(body, pop.body || []);
    c.appendChild(body);

    if (pop.cta) {
      var foot = el('div', 'mfoot');
      var txt = el('div', 'txt');
      if (pop.footnote) { var d = el('div', 'mdesc'); d.textContent = pop.footnote; txt.appendChild(d); }
      foot.appendChild(txt);
      var b = el('div', 'mcta'); b.textContent = pop.cta; foot.appendChild(b);
      c.appendChild(foot);
    }
  }

  function closePop() {
    var veil = $('veil');
    veil.classList.remove('on');
    veil.hidden = true;
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function popNav() {
    var nav = el('div', 'mnav');
    var prev = el('button'), next = el('button');
    prev.type = next.type = 'button';
    prev.textContent = '← Previous';
    next.textContent = 'Next →';
    prev.disabled = popN <= 1;
    next.disabled = popN >= popMax;
    prev.addEventListener('click', function () { openPop(popKind, popN - 1); });
    next.addEventListener('click', function () { openPop(popKind, popN + 1); });
    nav.appendChild(prev);
    nav.appendChild(next);
    return nav;
  }

  function isTodo(s) { return /^\[.*\]$/.test(String(s).trim()); }

  /* Copy carries live URLs; show them as links rather than raw text. Built
     as nodes, never innerHTML, so the copy can never inject markup. */
  function linkify(into, text) {
    var re = /https?:\/\/[^\s)<>"']+/g, last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) into.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = el('a', 'mlink');
      a.href = m[0];
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = m[0].replace(/^https?:\/\//, '');
      into.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) into.appendChild(document.createTextNode(text.slice(last)));
  }

  function popParas(into, list) {
    (list || []).forEach(function (t) {
      var p = el('p');
      if (isTodo(t)) {
        var s = el('span', 'mtodo');
        s.textContent = String(t).replace(/^\[|\]$/g, '');
        p.appendChild(s);
      } else { linkify(p, String(t)); }
      into.appendChild(p);
    });
  }

  function adPop(c, a) {
    var head = el('div', 'mhead');
    var k = el('div', 'mkicker'); k.textContent = 'Ad concept ' + a.n + ' of ' + popMax; head.appendChild(k);
    var t = el('div', 'mtitle'); t.id = 'mtitle'; t.textContent = a.title; head.appendChild(t);
    if (a.creative) { var s = el('div', 'msub it'); s.textContent = a.creative; head.appendChild(s); }
    c.appendChild(head);

    var body = el('div', 'mbody');
    popParas(body, a.primary);
    c.appendChild(body);

    var shots = el('div', 'mshots');
    [['feed', '4:5 feed'], ['story', '9:16 story']].forEach(function (pair) {
      if (!a[pair[0]]) return;
      var fig = el('figure', 'mshot');
      fig.style.margin = '0';
      var img = el('img');
      /* No lazy loading here: the modal is built while still hidden, and a
         lazy image in a display:none subtree never starts fetching. There
         are only two, and the user has just asked for them. */
      img.src = a[pair[0]];
      img.alt = 'Concept ' + a.n + ', ' + a.title + ', ' + pair[1];
      fig.appendChild(img);
      var cap = el('figcaption'); cap.textContent = pair[1]; fig.appendChild(cap);
      shots.appendChild(fig);
    });
    c.appendChild(shots);

    var foot = el('div', 'mfoot');
    var txt = el('div', 'txt');
    var hl = el('div', 'mhl'); hl.textContent = a.headline; txt.appendChild(hl);
    if (a.description) { var d = el('div', 'mdesc'); d.textContent = a.description; txt.appendChild(d); }
    foot.appendChild(txt);
    if (a.cta) { var b = el('div', 'mcta'); b.textContent = a.cta; foot.appendChild(b); }
    c.appendChild(foot);
  }

  function mailPop(c, e, data) {
    var head = el('div', 'mhead');
    var k = el('div', 'mkicker');
    k.textContent = 'Email ' + e.n + ' of ' + popMax + ' · Day ' + e.day +
      (data.from ? ' · From ' + data.from : '');
    head.appendChild(k);
    var t = el('div', 'mtitle'); t.id = 'mtitle'; t.textContent = e.subject; head.appendChild(t);
    if (e.preview) { var s = el('div', 'msub'); s.textContent = e.preview; head.appendChild(s); }
    c.appendChild(head);
    var body = el('div', 'mbody');
    popParas(body, e.body);
    c.appendChild(body);
  }

  $('mclose').addEventListener('click', closePop);
  $('veil').addEventListener('click', function (ev) { if (ev.target === $('veil')) closePop(); });
  document.addEventListener('keydown', function (ev) {
    if (!$('veil').classList.contains('on')) return;
    if (ev.key === 'Escape') { closePop(); }
    else if (ev.key === 'ArrowRight' && popN < popMax) { openPop(popKind, popN + 1); }
    else if (ev.key === 'ArrowLeft' && popN > 1) { openPop(popKind, popN - 1); }
  });

  /* --------------------------- fit --------------------------- */

  function scaleTo(s) {
    $('board').style.transform = 'scale(' + s + ')';
    $('stage').style.width = (BOARD_W * s) + 'px';
    $('stage').style.height = (BOARD_H * s) + 'px';
  }

  function fitBoard() {
    var avail = document.querySelector('.wrap').clientWidth - 32;
    scaleTo(Math.min(1, Math.max(MIN_SCALE, avail / BOARD_W)));
  }
  window.addEventListener('resize', fitBoard);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitBoard); }

  /* Printing keeps whatever scale the screen last used, which spills the
     board off the page. Size it to the usable width of a landscape sheet
     at 10mm margins instead, then put it back afterwards. Fitting the
     height too would shrink the type past readable, so a tall board is
     allowed to run onto a second page. */
  var PRINT_W = 1020;
  window.addEventListener('beforeprint', function () { scaleTo(PRINT_W / BOARD_W); });
  window.addEventListener('afterprint', fitBoard);

  /* --------------------------- boot --------------------------- */

  var params = new URLSearchParams(location.search);
  var inline = params.get('d');
  var raw = (params.get('c') || 'demo').toLowerCase();
  var slug = /^[a-z0-9-]{1,64}$/.test(raw) ? raw : 'demo';

  if (inline) {
    var cfg = decodeInline(inline);
    render(cfg || EMPTY, cfg ? '' : 'That preview link could not be read. Showing an empty map.');
  } else {
    fetch('clients/' + slug + '.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (cfg) { render(cfg); })
      .catch(function () {
        if (slug === 'demo') { render(EMPTY, 'No client map found. Showing an empty board.'); return; }
        fetch('clients/demo.json', { cache: 'no-cache' })
          .then(function (r) { return r.json(); })
          .then(function (cfg) { render(cfg, 'No map found for "' + slug + '". Showing the example map instead.'); })
          .catch(function () { render(EMPTY, 'No map found for "' + slug + '".'); });
      });
  }

  /* When embedded, report our height so the parent iframe can size itself.
     The page height is not monotonic with width: the board scales, and below
     1000px it is replaced by the stacked list. */
  if (window.parent !== window) {
    var lastH = 0;
    var reportHeight = function () {
      var h = Math.ceil(document.body.getBoundingClientRect().height);
      if (h !== lastH) {
        lastH = h;
        window.parent.postMessage({ type: 'bfmap:height', height: h }, '*');
      }
    };
    window.addEventListener('resize', reportHeight);
    window.addEventListener('load', reportHeight);
    if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.documentElement); }
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(reportHeight); }
    reportHeight();
  }
})();
</script>
</body>
</html>
