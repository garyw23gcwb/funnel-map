<!-- Paste this into a GoHighLevel page as a Custom HTML/JS element. Change
     the src to the map you want: index.html?c=<slug> for a client map,
     proposal.html?c=<slug> for a proposal. The map posts its own height
     to the parent, so the iframe grows with it and never scrolls inside. -->
<div id="bfmap" style="width:100%;max-width:1520px;margin:0 auto;">
  <iframe id="bfmap-frame"
    src="https://garyw23gcwb.github.io/funnel-map/proposal.html?c=risk3sixty"
    title="Funnel map"
    style="display:block;width:100%;height:1200px;border:0;"
    loading="eager"></iframe>
</div>
<script>
  window.addEventListener('message', function (ev) {
    if (ev.origin !== 'https://garyw23gcwb.github.io') return;
    var d = ev.data || {};
    if (d.type === 'bfmap:height' && d.height) {
      document.getElementById('bfmap-frame').style.height = (d.height + 8) + 'px';
    }
  });
</script>
